<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#03110f">
  <meta name="description" content="Карта галактики: переход к карте сектора.">
  <title>Timeline Project — Galaxy Map</title>
  <link rel="stylesheet" href="styles.css?v=galaxy">
  <link rel="stylesheet" href="timeline-skin.css?v=galaxy">
  <link rel="stylesheet" href="galaxy.css?v=galaxy">
</head>
<body>
  <div class="timeline-loader" id="timelineLoader" role="status" aria-live="polite">
    <div class="timeline-loader-core">
      <img class="timeline-loader-logo" src="assets/timeline-project-logo.png" alt="Timeline Project">
      <div class="timeline-loader-status">Galaxy handshake</div>
      <div class="timeline-loader-progress" aria-hidden="true"></div>
    </div>
  </div>

  <aside class="sectors-sidebar" id="sectorsSidebar" aria-label="Список секторов">
    <div class="sectors-sidebar-head">
      <div class="eyebrow"><span class="eyebrow-line"></span> SECTORS</div>
    </div>
    <ul class="sectors-list" id="sectorsList">
      <li>
        <button class="sector-list-item" type="button"
                data-x="73.03" data-y="31.5" data-href="sector.html"
                data-name="Сектор Копрулу">
          <span class="sector-list-dot"></span>
          <span class="sector-list-name">Сектор Копрулу</span>
        </button>
      </li>
    </ul>
  </aside>

  <main class="galaxy-stage" id="galaxyStage">
    <img class="galaxy-map" id="galaxyMap" src="assets/galaxy-map.jpg" alt="Карта галактики" draggable="false">

    <!-- Квадратная кнопка-сектор -->
    <button class="sector-hotspot" id="sectorHotspot" type="button"
            data-x="73.03" data-y="31.5" data-href="sector.html"
            aria-label="Выбрать сектор">
      <span class="hotspot-square" aria-hidden="true"></span>
      <span class="hotspot-label">SECTOR</span>
    </button>

    <!-- Боковая панель с краткой информацией -->
    <aside class="sector-panel" id="sectorPanel" hidden aria-label="Информация о секторе">
      <div class="sector-panel-head">
        <div class="eyebrow"><span class="eyebrow-line"></span> SECTOR DOSSIER</div>
        <button class="icon-button" id="closeSectorPanel" type="button" aria-label="Закрыть">×</button>
      </div>
      <div class="sector-panel-body">
        <h2 id="sectorPanelTitle">Сектор</h2>
        <p id="sectorPanelInfo">Краткая информация о секторе появится здесь.</p>
        <div class="sector-panel-icon">
          <button class="sector-icon-button" id="sectorIconButton" type="button"
                  aria-label="Открыть карту сектора">
            <img src="assets/timeline-project-mark.webp" alt="Карта сектора" width="300" height="300">
            <span class="sector-icon-caption">ОТКРЫТЬ КАРТУ</span>
          </button>
        </div>
      </div>
    </aside>

    <div class="galaxy-caption">
      <strong>TIMELINE PROJECT</strong>
      <span>GALAXY MAP · SELECT SECTOR</span>
    </div>
  </main>

  <script src="galaxy.js?v=galaxy" defer></script>
</body>
</html>
