name: Sync and deploy Koprulu Atlas

# Карта и производные тайлы никогда не коммитятся в Git.
# Build-job скачивает полный JPEG из URL в data/sources.json, временно строит
# все 534 тайла и загружает Pages artifact. Отдельный deploy-job публикует его.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'minimal.html'
      - 'app.js'
      - '*.css'
      - 'data/**'
      - 'docs/source/**'
      - 'tools/**'
      - '.github/workflows/sync-and-deploy.yml'

# Значение по умолчанию. Критичные права OIDC дополнительно заданы прямо у
# deploy-job: GitHub не наследует отсутствующие scopes между уровнями permissions.
permissions:
  contents: read

concurrency:
  group: koprulu-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout — только код и данные
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Зависимости сборки
        run: pip install -r tools/requirements.txt

      - name: Сверить полный канонический реестр мест со StarCraft Wiki
        run: |
          set -euo pipefail
          python3 tools/sync_starcraft_wiki.py
          python3 tools/sync_starcraft_wiki_places.py
          python3 tools/derive_catalog.py
          python3 tools/audit_original_google_doc.py
          test "$(python3 -c 'import json; print(len(json.load(open("data/planets.json"))))')" -eq 297

      - name: Скачать полный исходник карты из Drive
        env:
          GOOGLE_DRIVE_MAP_URL: ${{ vars.GOOGLE_DRIVE_MAP_URL }}
        run: |
          set -euo pipefail
          python3 tools/download_drive_file.py --out assets/_source/koprulu_map.jpg
          echo "SHA-256 скачанного исходника:"
          sha256sum assets/_source/koprulu_map.jpg
          file assets/_source/koprulu_map.jpg

      - name: Проверить местоположение систем по подписям карты
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
          python3 tools/verify_overrides_on_map.py assets/_source/koprulu_map.jpg \
            --radii 80,150,300 --json data/map-verification.json

      - name: Временно построить тайлы всей карты
        run: |
          set -euo pipefail
          python3 tools/build_tiles.py assets/_source/koprulu_map.jpg \
            --levels 1250,2500,5000,10000 --tile 512 --quality 82
          test -f assets/tiles.json
          test -f assets/map-preview.webp
          test "$(find assets/tiles -type f -name '*.webp' | wc -l)" -eq 534

      - name: Синхронизировать опубликованную таблицу (если задана)
        env:
          GOOGLE_SHEETS_CSV_URL: ${{ vars.GOOGLE_SHEETS_CSV_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SHEETS_CSV_URL:-}" ]; then
            echo "GOOGLE_SHEETS_CSV_URL не задан — используется JSON из репозитория"
          else
            python3 tools/sync_system_overrides.py --url "$GOOGLE_SHEETS_CSV_URL"
          fi

      - name: Проверить и собрать сайт
        run: |
          set -euo pipefail
          python3 tools/validate_data.py
          python3 tools/set_asset_version.py
          python3 tools/build_single_file.py
          python3 tools/stage_pages.py --out dist
          test "$(find dist/assets/tiles -type f -name '*.webp' | wc -l)" -eq 534
          test ! -e dist/assets/_source/koprulu_map.jpg
          echo "Размер Pages artifact:"
          du -sh dist

      - name: Загрузить временную сборку Pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    # Права расположены именно на job, который запрашивает OIDC-токен.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Проверить выдачу OIDC-токена с повторами
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || \
             [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub не выдал job переменные OIDC. Проверьте id-token: write и Pages Source = GitHub Actions."
            exit 1
          fi

          for delay in 0 5 15 30 60; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if curl --fail --silent --show-error \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}" >/dev/null; then
              echo "OIDC endpoint отвечает (попытка с задержкой ${delay}s)"
              exit 0
            fi
            echo "OIDC endpoint временно недоступен; повторяем…"
          done

          echo "::error::GitHub OIDC endpoint продолжает возвращать ошибку. Это сбой Actions, запустите job повторно позже."
          exit 1

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5.0.1
