name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      # Публикуется содержимое site/ — это корень сайта.
      # В Settings → Pages → Source должен стоять «GitHub Actions», иначе воркфлоу
      # не публикует: Pages будет отдавать корень репозитория через Jekyll.
      # Картинки собираются здесь из assets/src/: в Git лежат только исходники,
      # производные пиксели попадают сразу в артефакт.
      # data/ и assets/ живут в корне репозитория (data/ пишет sync.py), поэтому
      # перед загрузкой копируются рядом с содержимым site/.
      - name: Собрать картинки
        run: |
          pip install --quiet pillow
          python3 tools/build_assets.py
      - name: Собрать публикацию
        run: |
          rm -rf .publish
          mkdir -p .publish
          cp -R site/. .publish/
          for dir in data assets; do
            if [ -d "$dir" ]; then cp -R "$dir" .publish/; fi
          done
          # исходники картинок в веб не отдаются: только собранные тайлы и webp
          rm -rf .publish/assets/src
          du -sh .publish/* | sort -h
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./.publish
      - id: deployment
        uses: actions/deploy-pages@v4
