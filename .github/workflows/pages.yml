name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      # Публикуется содержимое site/ — это корень сайта. data/ и assets/ лежат в корне
      # репозитория (их пишет sync.py), поэтому перед загрузкой копируются в артефакт.
      - name: Собрать публикацию
        run: |
          rm -rf .publish
          mkdir -p .publish
          cp -R site/. .publish/
          for dir in data assets; do
            if [ -d "$dir" ]; then cp -R "$dir" .publish/; fi
          done
          ls -la .publish
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./.publish
      - id: deployment
        uses: actions/deploy-pages@v4
