name: Build image assets

# Пересборка картинок из исходников assets/src/: тайлы карты сектора, карта
# галактики, логотип, макеты. Результат не коммитится (производные пиксели в Git
# не хранятся) — он выкладывается артефактом, чтобы посмотреть результат до деплоя.
# Сам деплой собирает картинки сам, этот воркфлоу нужен для проверки.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Build assets
        run: python3 tools/build_assets.py --force
      - uses: actions/upload-artifact@v4
        with:
          name: site-images
          path: |
            assets/tiles
            assets/tiles.json
            assets/*.webp
          if-no-files-found: error
